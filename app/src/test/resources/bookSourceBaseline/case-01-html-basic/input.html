  <h1>第一章　山中</h1>
  <p>　　他推开木门，山风灌进来。</p>
  <p>门外是<b>一整片</b>灰白的雾，<i>什么都看不见</i>。</p>
  <div class="ad">本站域名 example.invalid，请勿相信任何广告</div>
  <p>他站了很久&hellip;久到肩膀发酸。</p>
  <p>回来的路上，他想起师父说过的一句&mdash;&mdash;</p>
  <p>&nbsp;&nbsp;&nbsp;&nbsp;「走得慢的人，才看得见路。」</p>
  <p>屋里很静&ensp;只有炭火&emsp;在响。</p>
  <p>桌上的茶凉了&thinsp;他也没去动。</p>

  <p>第二天清晨，他收拾好行囊，下山去了。</p>
