  <p>他说：「你来了。」</p>
  <p>「嗯。」她答，「路上下了点雨——不大，但很密。」</p>
  <p>他没接话。窗外的雨声……渐渐停了。</p>
  <p>"I'm not sure," he said. "It doesn't matter, anyway."</p>
  <p>She didn't answer. (3 + 4) = 7 — a trivial sum.</p>
  <p>书名《山中来信》；章节：第 3 章；页码 12/48。</p>
